syntax = "proto3";

package user.v1;

option go_package = "usersvc/gen/user/v1;userv1";

service UserService {
  rpc GetUser   (GetUserRequest)   returns (User);
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

message User {
  int64  id    = 1;
  string name  = 2;
  string email = 3;
}

message GetUserRequest       { int64 id = 1; }
message CreateUserRequest    { string name = 1; string email = 2; }
message ListUsersRequest     {}
message ListUsersResponse    { repeated User users = 1; }
message UpdateUserRequest    { int64 id = 1; string name = 2; string email = 3; }
message DeleteUserRequest    { int64 id = 1; }
message DeleteUserResponse   { bool  ok = 1; }
